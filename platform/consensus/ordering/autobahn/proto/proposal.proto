
syntax = "proto3";
import "common/proto/signature_info.proto";

package resdb.autobahn;

message Transaction{
  int32 id = 1;
  bytes data = 2;
  bytes hash = 3;
  int32 proxy_id = 4;
  int32 proposer_id = 5;
  int64 uid = 6;
  int64 create_time = 7;
  int64 queuing_time = 8;
  int64 ordering_key = 9;     // K(t): final ordering key for fair ordering
}

// Algorithm 1: TEE-signed timestamp attestation for a single transaction.
// σ_i = Sign_TEE(t_i, T_i) where T_i is the TEE's clock reading.
message SignedTimestamp {
  bytes txn_hash = 1;          // Transaction identifier (hash digest)
  int64 timestamp = 2;        // T_i: TEE clock value at time of receipt
  SignatureInfo signature = 3; // TEE signature over (txn_hash, timestamp)
  int32 sender_id = 4;        // Replica that produced this timestamp
}

// Batch of signed timestamps broadcast after timestamping a Car's transactions.
message TimestampBatch {
  repeated SignedTimestamp timestamps = 1;
  int32 sender_id = 2;
  // 64-byte ECDSA-P256 public key of the sender's TEE enclave: gx[32] || gy[32]
  // (SGX little-endian format). Present only when running with SGX TEE.
  // Receivers cache this per sender_id for signature verification.
  bytes tee_pubkey = 3;
}

// Per-transaction ordering key included in consensus blocks.
// K_r(t) = (f+1)-th smallest timestamp from collected TEE timestamps.
message OrderingKeyEntry {
  bytes txn_hash = 1;
  int64 ordering_key = 2;     // K_r(t): local ordering key computed by this replica
  SignatureInfo signature = 3; // TEE signature certifying this ordering key
}

message Header {
  bytes hash = 1;
  int32 height = 2;
  int32 proposer_id = 3;
  int32 proposal_id = 4;
  bytes prehash = 5;
}

message History {
  bytes hash = 1;
  int32 state = 2;
  int32 sender = 3;
}

message Cert {
  repeated SignatureInfo sign = 1;
}

// Tip reference for one lane in the Autobahn DAG.
message TipRef {
  int32 sender_id = 1;
  int64 block_id = 2;
}

// Sync HotStuff proposal extending the original Proposal.
message Proposal {
  int32 slot_id = 1;
  int32 sender_id = 2;
  repeated Block block = 3;
  bool fast_commit = 4;
  SignatureInfo sign = 5;
  bytes hash = 6;
  Cert cert = 7;

  // Sync HotStuff fields
  int32 view_number = 8;
  repeated TipRef tip_cut = 9;
  int64 threshold = 10;        // tau_current: execution threshold
  int64 prev_threshold = 11;   // tau_prev: previous execution threshold
  repeated int64 last_seen_vector = 12; // L vector: latest timestamp seen from each replica's TEE
  int64 propose_time = 13;     // time when proposal was created (for 2*delta timer)
  // Fair ordering: ordering keys for transactions in the execution window
  repeated OrderingKeyEntry ordering_keys = 14;
  // Batch-order fairness: ordered batches of transaction hashes.
  // Transactions within the same BatchGroup can be in any order relative to
  // each other, but batches are ordered (batch 0 before batch 1, etc.).
  repeated BatchGroup batch_groups = 15;
  // TEE-signed last-seen vector L⃗ (Section V-B).
  // 64-byte ECDSA-P256 signature from the proposer's TEE over the serialized
  // last_seen_vector bytes. Replicas verify this to prevent Byzantine inflation of τ.
  bytes last_seen_sig = 16;
};

enum MessageType {
  NewProposal = 0;
  Vote = 1;
  Prepare = 2;
  VoteAck = 3;
  Commit = 4;
  Recovery = 5;
  NewBlocks = 6;
  ProposalAck = 7;
  CMD_BlockACK = 8;
  CMD_BlockQuery = 9;
  CMD_SingleBlock = 10;
  CMD_ProposalQuery = 11;
  CMD_ProposalQueryResponse = 12;
  // Sync HotStuff message types
  SyncHS_Propose = 13;
  SyncHS_Vote = 14;
  SyncHS_Equivocation = 15;
  // Fair ordering: TEE timestamp dissemination
  TEE_Timestamps = 16;
  // Batch-order fairness: relative ordering dissemination
  BOF_RelativeOrder = 17;
};

message VoteMessage {
  bytes hash = 1;
  int32 proposer_id = 2;
  MessageType type = 3;
  int32 sender_id = 4;
  int32 proposal_id = 5;
};

message CommittedProposals{
  repeated Proposal proposals = 1;
  int32 sender_id = 2;
};

message HashValue{
	repeated uint64 bits = 1;
};

message SignInfo {
  bytes hash = 1;
  int32 sender_id = 2;
  int32 local_id = 3;
  SignatureInfo sign = 4;
}

message Block {
  message BlockData {
    repeated Transaction transaction = 1;
  }
  BlockData data = 1;
  bytes hash = 2;
  int32 sender_id = 3;
  int32 local_id = 4;
  int64 create_time = 5;
  repeated SignInfo last_sign_info = 6;
  repeated SignInfo sign_info = 7;
}

message BlockACK {
  bytes hash = 2;
  int32 sender_id = 3;
  int32 local_id = 4;
  int32 responder = 5;
  SignInfo sign_info = 6;
}

message BlockQuery {
  bytes hash = 2;
  int32 proposer = 3;
  int32 local_id = 4;
  int32 sender = 5;
}

message ProposalQuery {
  bytes hash = 2;
  int32 proposer = 3;
  int32 id = 4;
  int32 sender = 5;
}

message ProposalQueryResp {
  repeated Proposal proposal = 1;
}

message ProposalResponse {
  Header header = 1;
  int32 leader = 2;
}

message VoteMsg {
  int32 slot_id = 1;
  int32 sender_id = 2;
}

// Batch-Order Fairness: a group of transactions that may be ordered in any
// relative order (no f+1 majority distinguishes their receive order).
// Batches themselves are totally ordered.
message BatchGroup {
  repeated bytes txn_hashes = 1;
}

// Batch-Order Fairness: a replica's local receive order for transactions in a block.
// Each replica broadcasts this after receiving a block, recording the order in which
// it first observed each transaction (relative ordering indicator).
message RelativeOrdering {
  repeated bytes txn_hashes = 1;  // Transaction hashes in the order received by this replica
  int32 sender_id = 2;           // Replica that observed this ordering
  int64 block_local_id = 3;      // Block that triggered this ordering report
  int32 block_sender_id = 4;     // Owner of the block
}

// Equivocation proof: two conflicting proposals from the same leader in the same view.
message EquivocationProof {
  Proposal proposal_a = 1;
  Proposal proposal_b = 2;
}
