syntax = "proto3";
import "common/proto/signature_info.proto";

package resdb.autobahn;

// Messages of Pearl (paper Sec. 5-7).  Tags written `tee_tag` are produced by
// an enclave and verified through TEE.Verify; `SignatureInfo` fields are
// ordinary replica signatures (Car acknowledgments, votes, blames).

message Transaction {
  int32 id = 1;
  bytes data = 2;
  bytes hash = 3;            // id(t): SHA-256 of the client request
  int32 proxy_id = 4;
  int32 proposer_id = 5;
  int64 uid = 6;
  int64 create_time = 7;
  int64 queuing_time = 8;
  int64 ordering_key = 9;    // OL: K(t) at execution
}

// ---------------------------------------------------------------------------
// Dissemination layer (Sec. 5.2, Alg. 1)
// ---------------------------------------------------------------------------

// Retransmission of t with the sender's TEE evidence (BroadcastOLEcho /
// BroadcastBOFEcho): value = T (OL timestamp) or c_r(t) (BOF placement).
// `data` is the client request; receivers derive id(t) = SHA-256(data).
message Echo {
  bytes data = 1;
  int64 value = 2;
  bytes tee_tag = 3;
}

message EchoBatch {
  int32 sender_id = 1;
  repeated Echo echoes = 2;
}

message OlCarItem {
  bytes txn_hash = 1;
  int64 key = 2;             // K_r(t)
}

// One entry M_r[j] of a reception frontier, with j's enclave tag.
message Announcement {
  bool present = 1;
  int64 car = 2;
  bytes txn_hash = 3;
  bytes tee_tag = 4;
}

// Proof of Availability: f+1 acknowledgments of one Car.
message Poa {
  int64 index = 1;
  bytes car_hash = 2;
  repeated SignInfo acks = 3;
}

message Car {
  int32 lane = 1;
  int64 index = 2;
  bytes prev_hash = 3;
  bytes hash = 4;
  bytes tee_tag = 5;
  // Cars reference transactions by id(t); every replica holds the bodies
  // from the echoes, fetches missing ones (BodyQuery) and acknowledges a Car
  // only once it holds all of them, so a certified Car's transactions are
  // retrievable from a correct replica.
  reserved 6;
  repeated OlCarItem ol_items = 7;
  int64 frontier = 8;                 // G_r (OL) or w_r (BOF)
  repeated bytes bof_items = 9;       // enclave order
  repeated bool bof_heartbeat = 10;
  repeated Announcement m = 11;       // m[j-1] = M_r[j]
  Poa poa = 12;                       // latest certified Car of this lane
  int64 seal_time = 13;
  // Admission level proposed by the lane's owner (flow control only; not
  // part of the Car hash).  See AutoBahn::AdjustAdmission.
  int32 admit = 14;
}

message CarAck {
  int32 lane = 1;
  int64 index = 2;
  bytes car_hash = 3;
  SignInfo sign = 4;
}

message CarQuery {
  int32 lane = 1;
  int64 index = 2;
  int32 requester = 3;
}

// Request for the bodies of transactions referenced by a Car.
message BodyQuery {
  int32 requester = 1;
  repeated bytes ids = 2;
}

message BodyReply {
  int32 sender_id = 1;
  repeated bytes data = 2;   // client requests; id(t) = SHA-256(data)
}

// ---------------------------------------------------------------------------
// Consensus layer (Sec. 5.3, Alg. 2): Sync HotStuff over tip cuts
// ---------------------------------------------------------------------------

message Tip {
  int32 lane = 1;
  int64 index = 2;
  bytes car_hash = 3;
  Poa poa = 4;
}

// Delinquency claim <j, c>: lane j has not reached position c (BOF only).
message Claim {
  int32 lane = 1;
  int64 position = 2;
}

message Vote {
  int64 view = 1;
  int64 height = 2;
  bytes block_hash = 3;
  int32 sender_id = 4;
  SignatureInfo sign = 5;
}

message QuorumCert {
  int64 view = 1;
  int64 height = 2;
  bytes block_hash = 3;
  repeated Vote votes = 4;
}

message ConsensusBlock {
  int64 view = 1;
  int64 height = 2;
  bytes parent_hash = 3;
  QuorumCert parent_qc = 4;   // certificate of the parent (absent at height 1)
  repeated Tip tips = 5;      // one certified lane tip per replica
  repeated Claim claims = 6;  // BOF delinquency claims
  int32 proposer = 7;
  bytes hash = 8;
  bytes tee_tag = 9;          // TEE.SignBlock
  int64 propose_time = 10;
}

// Proposal as broadcast by the leader and forwarded by every voter.
message Proposal {
  ConsensusBlock block = 1;
  int32 forwarder = 2;
  // First proposal of a view: the certified block it extends (selected from
  // the Status messages), for replicas that do not hold it yet.
  ConsensusBlock parent = 3;
}

// Request for a consensus block this replica missed (by hash).
message BlockQuery {
  int32 requester = 1;
  bytes hash = 2;
}

message BlockReply {
  ConsensusBlock block = 1;
}

message Blame {
  int64 view = 1;
  int32 sender_id = 2;
  SignatureInfo sign = 3;
}

// Evidence that view `view` must be left: f+1 blames, or two conflicting
// blocks signed by the leader at the same height.
message QuitView {
  int64 view = 1;
  repeated Blame blames = 2;
  ConsensusBlock equivocation_a = 3;
  ConsensusBlock equivocation_b = 4;
}

// Sent to the next leader after quitting a view: the highest certified block
// this replica is locked on.
message Status {
  int64 view = 1;            // the view being entered
  int32 sender_id = 2;
  QuorumCert highest_qc = 3;
  ConsensusBlock highest_block = 4;
}

// ---------------------------------------------------------------------------

message SignInfo {
  bytes hash = 1;
  int32 sender_id = 2;
  int64 local_id = 3;
  SignatureInfo sign = 4;
}

enum MessageType {
  Unused = 0;
  Echo_Batch = 1;
  Car_Prop = 2;
  Car_Ack = 3;
  Car_Query = 4;
  SyncHS_Propose = 5;
  SyncHS_Vote = 6;
  SyncHS_Blame = 7;
  SyncHS_QuitView = 8;
  SyncHS_Status = 9;
  Body_Query = 10;
  Body_Reply = 11;
  Block_Query = 12;
  Block_Reply = 13;
}
